<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 照片裡是活動來賓，不希望被搜尋引擎收錄 -->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05060a">
<title>拍貼取件</title>
<style>
  :root {
    --bg: #05060a;
    --card: rgba(14, 15, 24, .62);
    --ink: #f2f3f8;
    --muted: #9ea3b5;
    --line: rgba(255, 255, 255, .12);
    --a1: #4d7dff;
    --a2: #9a63ff;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; background: var(--bg); }
  body {
    margin: 0;
    color: var(--ink);
    font: 16px/1.6 "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: max(20px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
  }

  /* 粒子背景：固定在最底層，不擋任何點擊 */
  #bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    pointer-events: none;
  }

  /* margin:auto 讓內容少的時候垂直置中、多的時候從上面開始排 */
  main { width: 100%; max-width: 480px; margin: auto; }
  header { text-align: center; padding: 8px 0 20px; }
  header .site { font-size: 13px; letter-spacing: .2em; color: var(--muted); }
  body.home header { visibility: hidden; }

  /* 玻璃卡片：半透明加模糊，粒子在後面流動但字仍然讀得清楚 */
  .card {
    background: var(--card);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    backdrop-filter: blur(16px) saturate(140%);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 24px 20px;
    margin-bottom: 16px;
  }
  .center { text-align: center; }
  h1 { font-size: 22px; line-height: 1.35; margin: 0 0 6px; }
  h2 { font-size: 15px; margin: 0 0 12px; color: var(--muted); font-weight: 600; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); font-size: 14px; }
  .big { font-size: 30px; font-weight: 700; margin: 14px 0 10px; }
  .emoji { font-size: 44px; line-height: 1; margin-bottom: 8px; }
  code.id {
    display: inline-block;
    background: rgba(255, 255, 255, .08);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 1px 10px;
    font: 600 15px/1.7 ui-monospace, "SF Mono", Consolas, monospace;
    letter-spacing: .12em;
  }

  /* 首頁（沒帶編號）：直接把字放在粒子上，不包卡片 */
  .hero { text-align: center; padding: 4vh 4px; position: relative; }
  /* 文字後面墊一層柔和的暗色暈，粒子再亮也不會蓋到字。
     z-index:-1 落在畫布之上（畫布在 DOM 裡比較前面），內容之下。 */
  .hero::before {
    content: '';
    position: absolute;
    inset: -40px -70px;
    z-index: -1;
    background: radial-gradient(ellipse at center,
      rgba(5, 6, 10, .82) 0%, rgba(5, 6, 10, .6) 42%, rgba(5, 6, 10, 0) 72%);
    pointer-events: none;
  }
  .hero h1 {
    font-size: clamp(38px, 11vw, 60px);
    font-weight: 700;
    letter-spacing: .04em;
    margin: 0 0 16px;
    background: linear-gradient(90deg, #9cc0ff, #c69cff 55%, #ff9db3);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  .hero .lead {
    font-size: 17px;
    max-width: 22em;
    margin: 0 auto;
    text-wrap: balance;
    color: rgba(242, 243, 248, .86);
    text-shadow: 0 1px 14px rgba(0, 0, 0, .8);
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 50px;
    padding: 0 20px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: rgba(255, 255, 255, .06);
    color: var(--ink);
    font: inherit;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    width: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  .btn.primary {
    background: linear-gradient(135deg, var(--a1), var(--a2));
    border-color: transparent;
    color: #fff;
  }
  .btn:active { transform: scale(.98); }
  .btn.small { min-height: 40px; font-size: 14px; border-radius: 10px; }

  .composite {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 10px;
    border: 1px solid var(--line);
    margin: 16px 0;
    background: rgba(255, 255, 255, .04);
  }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid figure { margin: 0; }
  .grid img {
    display: block;
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--line);
    margin-bottom: 8px;
    background: rgba(255, 255, 255, .04);
  }
  .tip {
    font-size: 13px;
    color: var(--muted);
    background: rgba(255, 255, 255, .06);
    border-radius: 10px;
    padding: 10px 12px;
    margin: 0;
  }
  .spinner {
    width: 28px; height: 28px;
    border: 3px solid var(--line);
    border-top-color: var(--a1);
    border-radius: 50%;
    margin: 12px auto;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }

  /* 不支援 backdrop-filter 的瀏覽器：卡片改成幾乎不透明，不然字會疊在粒子上看不清 */
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .card { background: rgba(14, 15, 24, .92); }
  }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<main>
  <header><div class="site" id="site">拍貼取件</div></header>
  <div id="app">
    <div class="card center"><div class="spinner" role="status" aria-label="載入中"></div></div>
  </div>
  <noscript><div class="card center">這個頁面需要開啟 JavaScript 才能顯示照片。</div></noscript>
</main>

<!-- 一定要用絕對路徑：這個頁面會被 /p/編號 這種網址載入，
     相對路徑會被解析成 /p/config.js 而拿到錯的東西 -->
<script src="/config.js"></script>
<script src="/bg.js" defer></script>
<script>
(function () {
  'use strict';

  var cfg = Object.assign({
    SITE_TITLE: '拍貼取件',
    READY_TEXT: '今晚 8 點前上線',
    PHOTO_BASE: '/data',
  }, window.SCAN_CONFIG || {});

  var app = document.getElementById('app');
  var base = String(cfg.PHOTO_BASE).replace(/\/+$/, '');

  document.title = cfg.SITE_TITLE;
  document.getElementById('site').textContent = cfg.SITE_TITLE;

  // 只用 textContent 塞資料，不用 innerHTML 拼接使用者可控的內容
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function show() {
    document.body.classList.remove('home');
    app.replaceChildren.apply(app, arguments);
  }

  // ---- 取件編號 ----------------------------------------------------------
  // QR 內容是大寫（為了縮小 QR），但客人手動改網址或舊連結可能是小寫，
  // 一律轉大寫。編號字母表不含 I L O 0 1，所以大小寫轉換不會有歧義。
  function readId() {
    var raw = '';
    var parts = location.pathname.split('/').filter(Boolean);
    try {
      if (parts.length >= 2 && parts[0].toLowerCase() === 'p') raw = decodeURIComponent(parts[1]);
      else raw = new URLSearchParams(location.search).get('id') || '';
    } catch (e) { raw = ''; }
    return raw.trim().toUpperCase();
  }
  var ID_OK = /^[A-Z0-9]{3,12}$/;   // 也順便擋掉路徑跳脫（../ 之類）
  var SAFE_NAME = /^[^\/\\]+$/;      // manifest 裡的檔名不能帶路徑

  // ---- 各種畫面 ----------------------------------------------------------
  // 沒帶編號：直接開網域的人。這不是錯誤，是歡迎畫面。
  function viewHome() {
    var w = el('div', 'hero');
    w.appendChild(el('h1', null, cfg.SITE_TITLE));
    w.appendChild(el('p', 'lead', '掃描照片上的 QR Code，就能下載你的拍貼與原始照片'));
    show(w);
    document.body.classList.add('home');
  }

  function viewInvalid() {
    var c = el('div', 'card center');
    c.appendChild(el('div', 'emoji', '🔍'));
    c.appendChild(el('h1', null, '找不到取件編號'));
    c.appendChild(el('p', 'muted', '請重新掃描照片上的 QR Code。'));
    show(c);
  }

  function viewPending(id) {
    var c = el('div', 'card center');
    c.appendChild(el('div', 'emoji', '📸'));
    c.appendChild(el('div', 'big', cfg.READY_TEXT));
    c.appendChild(el('p', null, '你的照片還在整理中，晚點回來看就會有了。'));
    var p = el('p', 'muted', '取件編號 ');
    p.appendChild(el('code', 'id', id));
    c.appendChild(p);
    c.appendChild(el('p', 'muted', '把這個網址存起來，或到時候再掃一次 QR Code 就可以。'));
    var b = el('button', 'btn', '重新檢查');
    b.type = 'button';
    b.onclick = start;
    c.appendChild(b);
    show(c);
  }

  function viewError() {
    var c = el('div', 'card center');
    c.appendChild(el('div', 'emoji', '📶'));
    c.appendChild(el('h1', null, '連線不太順'));
    c.appendChild(el('p', 'muted', '網路好像不穩，請再試一次。'));
    var b = el('button', 'btn primary', '重新載入');
    b.type = 'button';
    b.onclick = start;
    c.appendChild(b);
    show(c);
  }

  function viewReady(id, m) {
    var nodes = [];
    var dir = base + '/' + encodeURIComponent(id) + '/';

    var top = el('div', 'card');
    top.appendChild(el('h1', null, '你的拍貼好了'));
    top.appendChild(el('p', 'muted', '取件編號 ' + id));

    if (m.composite && SAFE_NAME.test(m.composite)) {
      var url = dir + encodeURIComponent(m.composite);
      var img = el('img', 'composite');
      img.src = url;
      img.alt = '拍貼成品';
      top.appendChild(img);

      var a = el('a', 'btn primary', '下載拍貼圖');
      a.href = url;
      a.setAttribute('download', m.composite);
      top.appendChild(a);
    }
    nodes.push(top);

    var photos = Array.isArray(m.photos) ? m.photos.filter(function (n) {
      return typeof n === 'string' && SAFE_NAME.test(n);
    }) : [];

    if (photos.length) {
      var box = el('div', 'card');
      box.appendChild(el('h2', null, '原始照片（' + photos.length + ' 張）'));
      var grid = el('div', 'grid');
      photos.forEach(function (name, i) {
        var u = dir + encodeURIComponent(name);
        var fig = el('figure');
        var im = el('img');
        im.src = u;
        im.alt = '原始照片 ' + (i + 1);
        im.loading = 'lazy';
        fig.appendChild(im);
        var dl = el('a', 'btn small', '下載');
        dl.href = u;
        dl.setAttribute('download', name);
        fig.appendChild(dl);
        grid.appendChild(fig);
      });
      box.appendChild(grid);
      nodes.push(box);
    }

    nodes.push(el('p', 'tip', 'iPhone 如果按下載沒有直接存到相簿：長按圖片，選「加入照片」就可以了。'));
    show.apply(null, nodes);
  }

  // ---- 載入 ------------------------------------------------------------
  // 404 = 還沒上線（正常狀況）；連線失敗 = 網路問題。兩者要分開，
  // 不然照片還沒傳的時候客人會看到「網路錯誤」而不是「今晚上線」。
  function load(id) {
    var ctl = new AbortController();
    var timer = setTimeout(function () { ctl.abort(); }, 12000);
    var url = base + '/' + encodeURIComponent(id) + '/manifest.json';

    return fetch(url, { cache: 'no-store', signal: ctl.signal })
      .then(function (res) {
        if (res.status === 404) return { state: 'pending' };
        if (!res.ok) return { state: 'error' };
        return res.json().then(
          function (m) { return { state: 'ready', m: m }; },
          // 拿到的不是 JSON（例如主機把不存在的路徑導回首頁）：當作還沒上線
          function () { return { state: 'pending' }; }
        );
      })
      .catch(function () { return { state: 'error' }; })
      .then(function (r) { clearTimeout(timer); return r; });
  }

  function start() {
    var id = readId();
    if (!id) { viewHome(); return; }
    if (!ID_OK.test(id)) { viewInvalid(); return; }

    var c = el('div', 'card center');
    c.appendChild(el('div', 'spinner'));
    show(c);

    load(id).then(function (r) {
      if (r.state === 'ready') viewReady(id, r.m);
      else if (r.state === 'pending') viewPending(id);
      else viewError();
    });
  }

  start();
})();
</script>
</body>
</html>
