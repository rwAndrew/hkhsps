<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 照片裡是活動來賓，不希望被搜尋引擎收錄 -->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<title>拍貼取件</title>
<style>
  :root {
    --bg: #ffffff;
    --ink: #0f1115;
    --ink-2: #4b5160;
    --muted: #7b8190;
    --line: #e8eaee;
    --soft: #f5f6f8;
    --accent: #2563eb;
    --r-lg: 20px;
    --r-md: 14px;
    --r-sm: 10px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; background: var(--bg); }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    color: var(--ink);
    background: var(--bg);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC",
          "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, p { margin: 0; }
  button { font: inherit; color: inherit; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
  h1:focus { outline: none; }

  /* ── 版面 ─────────────────────────────────────────────── */
  .wrap { width: 100%; max-width: 480px; margin: 0 auto; padding: 0 20px; }
  body.wide .wrap { max-width: 960px; }

  .top { padding-top: max(12px, env(safe-area-inset-top)); }
  .bar { display: flex; align-items: center; justify-content: space-between; height: 48px; }
  .brand { font-weight: 700; font-size: 15px; letter-spacing: .03em; }
  .chip {
    font: 600 12px/1 ui-monospace, "SF Mono", Consolas, monospace;
    letter-spacing: .1em;
    color: var(--ink-2);
    background: var(--soft);
    border-radius: 999px;
    padding: 7px 11px;
  }
  .chip[hidden] { display: none; }

  main { flex: 1; padding-top: 20px; padding-bottom: calc(48px + env(safe-area-inset-bottom)); }

  /* ── 文字 ─────────────────────────────────────────────── */
  h1 { font-size: 26px; line-height: 1.3; font-weight: 700; letter-spacing: -.01em; }
  h2 { font-size: 15px; font-weight: 600; }
  .lead { color: var(--ink-2); margin-top: 8px; }
  .small { font-size: 14px; color: var(--muted); }

  /* ── 按鈕 ─────────────────────────────────────────────── */
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    min-height: 52px;
    padding: 0 20px;
    border: 1px solid transparent;
    border-radius: var(--r-md);
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    transition: background-color .15s, transform .1s, opacity .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(.985); }
  .btn-primary { background: var(--ink); color: #fff; }
  .btn-primary:hover { background: #000; }
  .btn-secondary { background: #fff; border-color: var(--line); color: var(--ink); }
  .btn-secondary:hover { background: #fafbfc; }
  .btn[disabled], .btn[aria-busy="true"] { opacity: .55; cursor: progress; pointer-events: none; }

  .link {
    background: none;
    border: 0;
    padding: 6px 2px;
    font-size: 14px;
    font-weight: 600;
    color: var(--accent);
    cursor: pointer;
  }
  .link[disabled] { opacity: .5; cursor: progress; }

  .ico { display: inline-flex; width: 20px; height: 20px; flex: none; }
  .ico svg { width: 100%; height: 100%; }

  /* ── 置中狀態（尚未上線／連線失敗／編號錯誤／首頁）────────── */
  .state { text-align: center; padding-top: 9vh; }
  .badge {
    width: 64px; height: 64px;
    margin: 0 auto 24px;
    display: grid; place-items: center;
    background: var(--soft);
    border-radius: 20px;
    color: var(--ink);
  }
  .badge .ico { width: 28px; height: 28px; }
  .state .lead { max-width: 20em; margin-left: auto; margin-right: auto; text-wrap: balance; }
  .state .btn { max-width: 320px; margin: 28px auto 0; }
  .state .status { margin-top: 14px; min-height: 22px; }

  /* ── 照片上線 ─────────────────────────────────────────── */
  .ready { display: grid; gap: 28px; }
  .stage {
    background: var(--soft);
    border-radius: var(--r-lg);
    padding: 20px;
  }
  .stage .imgbtn { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: zoom-in; }
  /* 手機：限制高度，讓下方的「下載」按鈕在第一屏內就看得到（矮螢幕也是）。
     寬度由 aspect-ratio 依高度算出來，圖不會被拉伸或留白邊。 */
  .strip {
    display: block;
    height: min(52dvh, 480px);
    width: auto;
    max-width: 100%;
    margin: 0 auto;
    aspect-ratio: 1181 / 1748;
    object-fit: contain;
    background: #fff;
    border-radius: 6px;
    box-shadow: 0 1px 2px rgba(16, 24, 40, .08), 0 12px 32px rgba(16, 24, 40, .10);
  }
  .actions { display: grid; gap: 10px; margin-top: 24px; }

  .originals { margin-top: 36px; }
  .originals .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .count {
    display: inline-block;
    min-width: 22px;
    margin-left: 6px;
    padding: 1px 7px;
    font-size: 12px;
    font-weight: 600;
    text-align: center;
    color: var(--ink-2);
    background: var(--soft);
    border-radius: 999px;
  }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 12px; }
  .tile .imgbtn { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: zoom-in; }
  .tile img {
    display: block;
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    border-radius: var(--r-sm);
    background: var(--soft);
  }
  .tile .cap { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; font-size: 13px; color: var(--ink-2); }
  .tile .dl {
    display: grid; place-items: center;
    width: 36px; height: 36px; margin: -6px -8px -6px 0;
    border-radius: 999px;
    color: var(--ink);
    text-decoration: none;
  }
  .tile .dl:hover { background: var(--soft); }
  .tile .dl .ico { width: 18px; height: 18px; }

  @media (min-width: 880px) {
    .ready { grid-template-columns: minmax(300px, 380px) 1fr; gap: 64px; align-items: start; }
    .stage { position: sticky; top: 24px; }
    .strip { height: auto; width: 100%; }
    .grid { grid-template-columns: repeat(3, 1fr); }
    .side { padding-top: 8px; }
    .state { padding-top: 14vh; }
  }

  /* 圖片載入前後 */
  img[data-fade] { opacity: 0; transition: opacity .25s; }
  img[data-fade].loaded { opacity: 1; }

  /* ── 載入骨架 ─────────────────────────────────────────── */
  .sk {
    background: linear-gradient(90deg, var(--soft) 25%, #eceef2 37%, var(--soft) 63%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease infinite;
    border-radius: var(--r-sm);
  }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
  .sk-title { height: 30px; width: 55%; }
  .sk-line { height: 16px; width: 80%; margin-top: 12px; }
  .sk-img { aspect-ratio: 1181 / 1748; border-radius: var(--r-lg); }

  /* ── 放大檢視 ─────────────────────────────────────────── */
  dialog#viewer {
    border: 0; padding: 0; margin: 0;
    width: 100%; height: 100%;
    max-width: none; max-height: none;
    background: transparent;
  }
  dialog#viewer::backdrop { background: rgba(15, 17, 21, .88); }
  .vbox {
    height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px;
    padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
  }
  #vimg { max-width: 100%; max-height: calc(100dvh - 130px); object-fit: contain; border-radius: 8px; background: #fff; }
  .vbar { display: flex; gap: 10px; }
  .vbar .btn { width: auto; min-height: 46px; padding: 0 22px; }
  .vbar .btn-ghost { background: rgba(255, 255, 255, .14); color: #fff; }
  .vbar .btn-ghost:hover { background: rgba(255, 255, 255, .22); }

  /* ── 提示 ─────────────────────────────────────────────── */
  #toast {
    position: fixed;
    left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translate(-50%, 12px);
    max-width: calc(100% - 32px);
    padding: 12px 18px;
    background: var(--ink); color: #fff;
    font-size: 14px;
    border-radius: 999px;
    opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s;
    z-index: 10;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    .sk { animation: none; }
    * { transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <span class="brand" id="brand">拍貼取件</span>
    <span class="chip" id="chip" hidden></span>
  </div>
</header>

<main class="wrap" id="app"></main>

<div id="toast" role="status" aria-live="polite"></div>

<dialog id="viewer" aria-label="放大檢視">
  <div class="vbox" id="vbox">
    <img id="vimg" alt="">
    <div class="vbar">
      <a class="btn btn-primary" id="vdl" download>下載</a>
      <button class="btn btn-ghost" id="vclose" type="button">關閉</button>
    </div>
  </div>
</dialog>

<noscript><p style="padding:24px;text-align:center">這個頁面需要開啟 JavaScript 才能顯示照片。</p></noscript>

<!-- 用相對路徑：GitHub Pages 的專案站掛在 /<repo>/ 底下，
     寫成 /config.js 會指到網域根目錄而 404。
     編號改放在網址的 # 之後，所以路徑永遠是 /<repo>/，相對路徑不會跑掉。 -->
<script src="config.js"></script>
<script>
(function () {
  'use strict';

  const cfg = Object.assign({
    SITE_TITLE: '拍貼取件',
    READY_TEXT: '今晚 8 點前上線',
    PHOTO_BASE: '/data',
    EXPIRED: false,
    EXPIRED_TEXT: '照片已經到期刪除',
  }, window.SCAN_CONFIG || {});

  const $ = (id) => document.getElementById(id);
  const app = $('app');
  const base = String(cfg.PHOTO_BASE).replace(/\/+$/, '');

  document.title = cfg.SITE_TITLE;
  $('brand').textContent = cfg.SITE_TITLE;

  // ── 小工具 ───────────────────────────────────────────────
  // 資料一律用 textContent 塞，不用 innerHTML 拼接任何外來字串
  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  // 圖示只有這裡的常數字串會進 innerHTML
  const ICONS = {
    download: '<path d="M12 4v11m0 0l-4-4m4 4l4-4M5 19h14"/>',
    share: '<path d="M12 15V4m0 0L8 8m4-4l4 4M6 12v6a2 2 0 002 2h8a2 2 0 002-2v-6"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    wifiOff: '<path d="M3 3l18 18"/><path d="M8.5 16.4a5 5 0 017 0"/><path d="M5 12.9a10 10 0 015.2-2.7"/><path d="M19 12.9a10 10 0 00-2.9-1.9"/><path d="M2 8.8a15 15 0 014.2-2.6"/><path d="M12 20h.01"/>',
    alert: '<circle cx="12" cy="12" r="9"/><path d="M12 8v5m0 3.5h.01"/>',
    qr: '<rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h2v2h-2zM18 14h2M14 18h2v2m2-2h2v2"/>',
    refresh: '<path d="M20 11a8 8 0 10-2.3 5.7M20 5v6h-6"/>',
    archive: '<path d="M4 7h16v3H4zM6 10v8a1 1 0 001 1h10a1 1 0 001-1v-8M10 14h4"/>',
    lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',
  };
  function icon(name) {
    const s = document.createElement('span');
    s.className = 'ico';
    s.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" ' +
      'stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + ICONS[name] + '</svg>';
    return s;
  }

  function button(cls, label, iconName) {
    const b = el('button', 'btn ' + cls);
    b.type = 'button';
    if (iconName) b.appendChild(icon(iconName));
    b.appendChild(el('span', null, label));
    return b;
  }
  const setLabel = (b, text) => { b.lastChild.textContent = text; };

  let toastTimer = 0;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
  }

  const hhmm = () => new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });

  function setChip(id) {
    const c = $('chip');
    c.hidden = !id;
    c.textContent = id ? '編號 ' + id : '';
  }

  // 換畫面：清空、放新內容、把焦點移到標題（螢幕閱讀器才知道畫面變了）
  function show(wide, ...nodes) {
    document.body.classList.toggle('wide', !!wide);
    app.replaceChildren(...nodes);
    const h = app.querySelector('h1');
    if (h) { h.tabIndex = -1; h.focus({ preventScroll: true }); }
    window.scrollTo(0, 0);
  }

  // ── 取件編號與金鑰 ───────────────────────────────────────
  // QR 的網址長這樣： https://…/hkhsps/#K7WHMX3B.金鑰
  //
  // 金鑰放在 # 之後是刻意的：瀏覽器「不會」把 # 後面的內容送給伺服器，
  // 所以 GitHub 的日誌裡永遠不會出現任何一組金鑰。
  // 照片放在公開的 repo，靠的就是這把金鑰 —— 沒有它，下載到的只是亂碼。
  function readTicket() {
    let raw = '';
    try {
      const h = location.hash.replace(/^#/, '');
      if (h) raw = decodeURIComponent(h);
      else {
        const parts = location.pathname.split('/').filter(Boolean);
        // 舊的 /p/編號 網址（Vercel 時期）仍然認得
        if (parts.length >= 2 && parts[parts.length - 2].toLowerCase() === 'p') {
          raw = decodeURIComponent(parts[parts.length - 1]);
        } else raw = new URLSearchParams(location.search).get('id') || '';
      }
    } catch (e) { raw = ''; }

    const [id, key] = raw.trim().split('.');
    return { id: (id || '').toUpperCase(), key: (key || '').toUpperCase() };
  }
  const ID_OK = /^[A-Z0-9]{3,12}$/;   // 也順便擋掉路徑跳脫（../ 之類）
  const KEY_OK = /^[A-Z2-7]{10,40}$/;
  const SAFE_NAME = /^[^\/\\]+$/;      // manifest 裡的檔名不能帶路徑

  // ── 置中型畫面共用骨架 ───────────────────────────────────
  function stateView(iconName, title, lead) {
    const w = el('div', 'state');
    const b = el('div', 'badge');
    b.appendChild(icon(iconName));
    w.appendChild(b);
    w.appendChild(el('h1', null, title));
    if (lead) w.appendChild(el('p', 'lead', lead));
    return w;
  }

  // ── 各畫面 ───────────────────────────────────────────────
  function viewLoading() {
    const head = el('div');
    head.appendChild(el('div', 'sk sk-title'));
    head.appendChild(el('div', 'sk sk-line'));
    const w = el('div', 'ready');
    w.appendChild(el('div', 'sk sk-img'));
    w.appendChild(head);
    w.setAttribute('aria-busy', 'true');
    show(true, w);
  }

  // 沒帶編號：直接開網域的人。這不是錯誤，是歡迎畫面。
  function viewHome() {
    show(false, stateView('qr', cfg.SITE_TITLE, '掃描照片上的 QR Code，就能下載你的拍貼與原始照片。'));
  }

  // 編號格式不對：不發任何請求
  function viewInvalid() {
    show(false, stateView('alert', '找不到取件編號', '這個網址不是有效的取件連結。請重新掃描照片上的 QR Code。'));
  }

  // 照片還沒上傳（manifest 404）
  function viewPending(id, key) {
    const w = stateView('clock', cfg.READY_TEXT, '你的照片還在整理中。上線之後回到這個頁面重新檢查，就能看到了。');
    const btn = button('btn-primary', '重新檢查', 'refresh');
    const status = el('p', 'small status', '檢查時間　' + hhmm());
    status.id = 'status';
    btn.onclick = () => recheck(id, key, btn, status);
    w.appendChild(btn);
    w.appendChild(status);
    show(false, w);
  }

  // 重新檢查：還沒上線就留在原畫面並說明，不然按了像是沒反應
  function recheck(id, key, btn, status) {
    btn.setAttribute('aria-busy', 'true');
    setLabel(btn, '檢查中…');
    load(id).then((r) => {
      if (r.state === 'pending') {
        btn.removeAttribute('aria-busy');
        setLabel(btn, '重新檢查');
        status.textContent = '還沒有照片　·　檢查時間　' + hhmm();
        toast('還沒有照片，晚點再試一次');
      } else {
        route(id, key, r);
      }
    });
  }

  // 照片已經過了保留期限、被刪除了。config.js 的 EXPIRED 設成 true 就會顯示這個，
  // 不然「今晚 8 點前上線」在照片刪掉之後就是一句錯的話。
  function viewExpired() {
    show(false, stateView('archive', cfg.EXPIRED_TEXT,
      '為了保護隱私，照片只保留一段時間。現在已經全部刪除，無法再取回。'));
  }

  // 連線失敗（跟「還沒上線」分開，不會誤報）
  function viewError(id) {
    const w = stateView('wifiOff', '連線不太順', '請確認網路連線後再試一次。');
    const btn = button('btn-primary', '重新載入', 'refresh');
    btn.onclick = start;
    w.appendChild(btn);
    show(false, w);
  }

  // 照片已上線
  // urls：已解密的 blob 網址對照表；沒加密時傳 null，直接用原網址
  function viewReady(id, m, urls) {
    const dir = base + '/' + encodeURIComponent(id) + '/';
    const urlOf = (name) => (urls ? urls[name] : dir + encodeURIComponent(name));

    const root = el('div', 'ready');
    const side = el('div', 'side');

    // 左：成品圖
    if (m.composite && SAFE_NAME.test(m.composite)) {
      const src = urlOf(m.composite);
      const stage = el('div', 'stage');
      const ib = el('button', 'imgbtn');
      ib.type = 'button';
      ib.setAttribute('aria-label', '放大檢視拍貼成品');
      ib.appendChild(fadeImg(src, '拍貼成品', 'strip'));
      ib.onclick = () => openViewer(src, niceName(m.composite));
      stage.appendChild(ib);
      root.appendChild(stage);

      // 右：標題與主要動作
      const head = el('div');
      head.appendChild(el('h1', null, '你的拍貼好了'));
      head.appendChild(el('p', 'lead', '點圖片可以放大。手機長按圖片，就能直接存到相簿。'));
      side.appendChild(head);

      const actions = el('div', 'actions');
      const dl = el('a', 'btn btn-primary');
      bindDownload(dl, src, niceName(m.composite));
      dl.appendChild(icon('download'));
      dl.appendChild(el('span', null, '下載拍貼圖'));
      // 跨網站時由 downloadFile 自己跳提示，這裡只處理同網站的
      dl.addEventListener('click', () => { if (!isCrossOrigin(src)) toast('開始下載'); });
      actions.appendChild(dl);

      // 手機的分享面板可以直接「儲存影像」到相簿，比下載到檔案 App 順手；
      // 不支援的瀏覽器（多數桌機）不顯示這顆，不放一顆按了沒用的按鈕。
      if (canShareFiles()) {
        const sh = button('btn-secondary', '存到相簿或分享', 'share');
        sh.onclick = () => shareFile(sh, src, niceName(m.composite));
        actions.appendChild(sh);
      }
      side.appendChild(actions);
    } else {
      const head = el('div');
      head.appendChild(el('h1', null, '你的照片好了'));
      side.appendChild(head);
      root.appendChild(side);
    }

    // 原始照片
    const photos = (Array.isArray(m.photos) ? m.photos : [])
      .filter((n) => typeof n === 'string' && SAFE_NAME.test(n));

    if (photos.length) {
      const box = el('section', 'originals');
      const row = el('div', 'row');
      const h = el('h2', null, '原始照片');
      h.appendChild(el('span', 'count', String(photos.length)));
      row.appendChild(h);

      if (photos.length > 1) {
        const zip = el('button', 'link', '全部下載');
        zip.type = 'button';
        zip.onclick = () => downloadZip(zip, id, photos.map((n) => ({ name: niceName(n), url: urlOf(n) })));
        row.appendChild(zip);
      }
      box.appendChild(row);

      const grid = el('div', 'grid');
      photos.forEach((name, i) => {
        const url = urlOf(name);
        const tile = el('div', 'tile');

        const ib = el('button', 'imgbtn');
        ib.type = 'button';
        ib.setAttribute('aria-label', '放大檢視照片 ' + (i + 1));
        const img = fadeImg(url, '原始照片 ' + (i + 1));
        img.loading = 'lazy';
        ib.appendChild(img);
        ib.onclick = () => openViewer(url, niceName(name));
        tile.appendChild(ib);

        const cap = el('div', 'cap');
        cap.appendChild(el('span', null, '照片 ' + (i + 1)));
        const d = el('a', 'dl');
        bindDownload(d, url, niceName(name));
        d.setAttribute('aria-label', '下載照片 ' + (i + 1));
        d.appendChild(icon('download'));
        cap.appendChild(d);
        tile.appendChild(cap);
        grid.appendChild(tile);
      });
      box.appendChild(grid);
      side.appendChild(box);
    }

    root.appendChild(side);
    show(true, root);
  }

  // 圖片載入完才淡入，不會看到一半的圖；載入失敗給個明確的提示
  function fadeImg(src, alt, cls) {
    const img = el('img', cls || '');
    img.alt = alt;
    img.decoding = 'async';
    img.setAttribute('data-fade', '');
    img.onload = () => img.classList.add('loaded');
    img.onerror = () => { img.classList.add('loaded'); img.alt = alt + '（載入失敗）'; };
    img.src = src;
    return img;
  }

  // ── 放大檢視 ─────────────────────────────────────────────
  const dlg = $('viewer');
  function openViewer(url, name) {
    if (!dlg.showModal) { window.open(url, '_blank', 'noopener'); return; }   // 很舊的瀏覽器
    $('vimg').src = url;
    $('vimg').alt = name;
    $('vdl').href = url;
    $('vdl').setAttribute('download', name);
    dlg.showModal();
  }
  // 用按鈕或點背景關閉時直接清掉圖；按 Esc 關閉時靠 close 事件清
  $('vdl').addEventListener('click', (e) => {
    const a = $('vdl');
    if (isCrossOrigin(a.href)) { e.preventDefault(); downloadFile(a.href, a.getAttribute('download')); }
  });
  const closeViewer = () => { if (dlg.open) dlg.close(); $('vimg').removeAttribute('src'); };
  $('vclose').onclick = closeViewer;
  $('vbox').addEventListener('click', (e) => { if (e.target === $('vbox')) closeViewer(); });
  dlg.addEventListener('close', () => $('vimg').removeAttribute('src'));

  // ── 分享（存到相簿）──────────────────────────────────────
  function canShareFiles() {
    try {
      return !!(navigator.share && navigator.canShare &&
        navigator.canShare({ files: [new File(['x'], 'a.png', { type: 'image/png' })] }));
    } catch (e) { return false; }
  }

  async function shareFile(btn, url, name) {
    btn.setAttribute('aria-busy', 'true');
    setLabel(btn, '準備中…');
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('http ' + res.status);
      const blob = await res.blob();
      const file = new File([blob], name, { type: blob.type || 'image/jpeg' });
      if (navigator.canShare({ files: [file] })) await navigator.share({ files: [file] });
      else saveBlob(blob, name);
    } catch (e) {
      // 使用者自己關掉分享面板不算錯誤
      if (!e || e.name !== 'AbortError') toast('無法開啟分享，請改用下載');
    } finally {
      btn.removeAttribute('aria-busy');
      setLabel(btn, '存到相簿或分享');
    }
  }

  // ── 下載 ────────────────────────────────────────────────
  // 照片放在另一個網站時，瀏覽器會無視 <a download>，直接跳過去開那張圖，
  // 看起來就是「下載鈕變成開新分頁」。所以跨網站時攔下點擊，自己抓成檔案再存
  // （這需要對方網站有設 CORS，匯出工具產生的 vercel.json 已經設好）。
  // 抓不到就退回開新分頁，至少客人還能長按儲存。
  const isCrossOrigin = (url) => {
    try { return new URL(url, location.href).origin !== location.origin; } catch (e) { return false; }
  };

  async function downloadFile(url, name) {
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('http ' + res.status);
      saveBlob(await res.blob(), name);
      toast('開始下載');
    } catch (e) {
      window.open(url, '_blank', 'noopener');
      toast('已在新分頁開啟，長按圖片可以儲存');
    }
  }

  function bindDownload(a, url, name) {
    a.href = url;
    a.setAttribute('download', name);
    a.addEventListener('click', (e) => {
      if (isCrossOrigin(url)) { e.preventDefault(); downloadFile(url, name); }
    });
  }

  function saveBlob(blob, name) {
    const u = URL.createObjectURL(blob);
    const a = el('a');
    a.href = u;
    a.setAttribute('download', name);
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 30000);
  }

  // ── 全部下載（打包成 zip）────────────────────────────────
  // 不引入任何套件：只做「不壓縮」的 zip（JPEG 本來就壓縮過了，再壓沒有意義），
  // 格式很單純，幾十行就能寫對。
  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(buf) {
    let c = 0xffffffff;
    for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xff] ^ (c >>> 8);
    return (c ^ 0xffffffff) >>> 0;
  }

  function makeZip(files) {
    const enc = new TextEncoder();
    const d = new Date();
    const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
    const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();

    const parts = [], central = [];
    let offset = 0;

    for (const f of files) {
      const name = enc.encode(f.name);
      const crc = crc32(f.data);
      const size = f.data.length;

      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true);
      lh.setUint16(4, 20, true);
      lh.setUint16(6, 0x0800, true);       // 檔名為 UTF-8
      lh.setUint16(8, 0, true);            // 不壓縮
      lh.setUint16(10, time, true);
      lh.setUint16(12, date, true);
      lh.setUint32(14, crc, true);
      lh.setUint32(18, size, true);
      lh.setUint32(22, size, true);
      lh.setUint16(26, name.length, true);
      lh.setUint16(28, 0, true);
      parts.push(lh.buffer, name, f.data);

      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true);
      ch.setUint16(4, 20, true);
      ch.setUint16(6, 20, true);
      ch.setUint16(8, 0x0800, true);
      ch.setUint16(10, 0, true);
      ch.setUint16(12, time, true);
      ch.setUint16(14, date, true);
      ch.setUint32(16, crc, true);
      ch.setUint32(20, size, true);
      ch.setUint32(24, size, true);
      ch.setUint16(28, name.length, true);
      ch.setUint32(42, offset, true);
      central.push(ch.buffer, name);

      offset += 30 + name.length + size;
    }

    let centralSize = 0;
    for (const p of central) centralSize += p.byteLength;

    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true);
    end.setUint16(8, files.length, true);
    end.setUint16(10, files.length, true);
    end.setUint32(12, centralSize, true);
    end.setUint32(16, offset, true);

    return new Blob([...parts, ...central, end.buffer], { type: 'application/zip' });
  }

  async function downloadZip(btn, id, items) {
    btn.disabled = true;
    const original = btn.textContent;
    try {
      const files = [];
      for (let i = 0; i < items.length; i++) {
        btn.textContent = '打包中 ' + (i + 1) + '/' + items.length;
        const res = await fetch(items[i].url);
        if (!res.ok) throw new Error('http ' + res.status);
        files.push({ name: items[i].name, data: new Uint8Array(await res.arrayBuffer()) });
      }
      saveBlob(makeZip(files), '拍貼原檔_' + id + '.zip');
      toast('開始下載');
    } catch (e) {
      toast('打包失敗，請改用單張下載');
    } finally {
      btn.disabled = false;
      btn.textContent = original;
    }
  }

  // ── 解密 ─────────────────────────────────────────────────
  // 照片放在公開的 GitHub repo，所以每個檔案都是用 AES-128-GCM 加密過的。
  // 金鑰來自網址 # 之後的那段，伺服器從頭到尾看不到。
  //
  // 檔案格式： [12 bytes IV][密文 + 16 bytes 驗證標籤]
  // 金鑰推導： SHA-256(金鑰:編號) 取前 16 bytes
  //            （加上編號當鹽，而且瀏覽器端不必實作 base32 解碼）
  const blobUrls = [];

  async function importKey(secret, id) {
    const bytes = new TextEncoder().encode(secret + ':' + id);
    const hash = await crypto.subtle.digest('SHA-256', bytes);
    return crypto.subtle.importKey('raw', hash.slice(0, 16), { name: 'AES-GCM' }, false, ['decrypt']);
  }

  async function decryptOne(key, buf, type) {
    const plain = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12));
    const url = URL.createObjectURL(new Blob([plain], { type }));
    blobUrls.push(url);
    return url;
  }

  // 把這一組的所有檔案抓下來解密，回傳「檔名 → 可直接使用的網址」。
  // 解密後的網址是 blob:，跟頁面同源，所以下載、分享、打包都能正常運作。
  async function decryptAll(id, secret, m, onProgress) {
    const key = await importKey(secret, id);
    const dir = base + '/' + encodeURIComponent(id) + '/';
    const names = [m.composite, ...(m.photos || [])].filter(
      (n) => typeof n === 'string' && SAFE_NAME.test(n));
    const map = {};

    for (let i = 0; i < names.length; i++) {
      onProgress(i, names.length);
      const res = await fetch(dir + encodeURIComponent(names[i]), { cache: 'no-store' });
      if (!res.ok) throw Object.assign(new Error('下載失敗'), { kind: 'net' });
      const buf = await res.arrayBuffer();
      try {
        map[names[i]] = await decryptOne(key, buf, m.type || 'image/jpeg');
      } catch (e) {
        // AES-GCM 會驗證內容，解不開就是金鑰不對（網址被截斷）或檔案損壞
        throw Object.assign(new Error('解密失敗'), { kind: 'key' });
      }
    }
    onProgress(names.length, names.length);
    return map;
  }

  // 下載時要給客人看得懂的檔名，不要是 1.enc
  const niceName = (name) => String(name).replace(/\.enc$/i, '.jpg');

  // ── 載入 ─────────────────────────────────────────────────
  // 404 = 還沒上線（正常狀況）；連線失敗 = 網路問題。兩者要分開，
  // 不然照片還沒傳的時候客人會看到「網路錯誤」而不是「今晚上線」。
  function load(id) {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 12000);
    const url = base + '/' + encodeURIComponent(id) + '/manifest.json';

    return fetch(url, { cache: 'no-store', signal: ctl.signal })
      .then((res) => {
        if (res.status === 404) return { state: 'pending' };
        if (!res.ok) return { state: 'error' };
        return res.json().then(
          (m) => ({ state: 'ready', m }),
          // 拿到的不是 JSON（例如主機把不存在的路徑導回首頁）：當作還沒上線
          () => ({ state: 'pending' })
        );
      })
      .catch(() => probe(url))
      .then((r) => { clearTimeout(timer); return r; });
  }

  // fetch 失敗有兩種可能：
  //   (1) 真的連不上（沒網路）
  //   (2) 照片放在另一個網站，對方回了 404 卻沒帶 CORS 標頭 ——
  //       瀏覽器不讓我們看那個回應，一律當成失敗。
  // 用 no-cors 再試一次：能拿到回應（即使是看不到內容的「不透明回應」）就代表
  // 伺服器活著，那就是 (2)，也就是「還沒上傳」，不是網路問題。
  function probe(url) {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 8000);
    return fetch(url, { mode: 'no-cors', cache: 'no-store', signal: ctl.signal })
      .then(() => ({ state: 'pending' }), () => ({ state: 'error' }))
      .then((r) => { clearTimeout(timer); return r; });
  }

  // 解密進度：檔案要整個下載完才能解，所以一定要有回饋
  function viewDecrypting() {
    const w = stateView('lock', '正在解鎖你的照片', '照片是加密保存的，需要先下載並解開。');
    const p = el('p', 'small status', '準備中…');
    p.id = 'decstat';
    w.appendChild(p);
    show(false, w);
    return (i, n) => {
      const el2 = $('decstat');
      if (el2) el2.textContent = i >= n ? '快好了…' : `解鎖中　${i + 1} / ${n}`;
    };
  }

  // 網址被截斷、或金鑰少打幾個字時會走到這裡
  function viewBadKey() {
    show(false, stateView('alert', '這個連結不完整',
      '照片是加密的，需要完整的連結才能打開。請重新掃描照片上的 QR Code，不要手動輸入網址。'));
  }

  function viewNoCrypto() {
    show(false, stateView('alert', '這個瀏覽器無法解鎖照片',
      '請用 Chrome、Safari 或 Edge 開啟，並確認網址是 https 開頭。'));
  }

  async function route(id, key, r) {
    if (r.state === 'pending') { (cfg.EXPIRED ? viewExpired() : viewPending(id, key)); return; }
    if (r.state === 'error') { viewError(id); return; }

    const m = r.m;
    if (!m.enc) { viewReady(id, m, null); return; }     // 沒加密（本機測試用）

    if (!key || !KEY_OK.test(key)) { viewBadKey(); return; }
    if (!window.crypto || !crypto.subtle) { viewNoCrypto(); return; }

    const onProgress = viewDecrypting();
    try {
      const urls = await decryptAll(id, key, m, onProgress);
      viewReady(id, m, urls);
    } catch (e) {
      if (e && e.kind === 'key') viewBadKey();
      else viewError(id);
    }
  }

  function start() {
    const { id, key } = readTicket();
    if (!id) { setChip(''); viewHome(); return; }
    if (!ID_OK.test(id)) { setChip(''); viewInvalid(); return; }

    setChip(id);
    viewLoading();
    load(id).then((r) => route(id, key, r));
  }

  start();
})();
</script>
</body>
</html>
